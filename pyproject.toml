[project]
name = "cluster-ci"
version = "0.1.0"
description = "GitOps continuous integration for DVC research pipelines"
authors = [
    { name = "UNIL-DESI" }
]
requires-python = ">=3.10"
dependencies = [
    "flask",
    "psutil",
    "requests",
    "authlib",
    "python-dotenv",
    "pyyaml",
    "networkx>=3.0",
    "dvc==3.67.1",
    "ruamel.yaml>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
cluster-run = "cluster.cluster_run:main"
cluster-update = "cluster.cluster_update:main"

[tool.pytest.ini_options]
timeout = 120

