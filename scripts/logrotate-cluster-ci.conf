# Configuration logrotate pour Cluster-CI (Headnode)
# Assure la rotation quotidienne et la compression des journaux de jobs et du journal de bord

/home/*/cluster-ci/job_logs/*.log /home/*/cluster-ci/cluster-ci-runs.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    maxsize 10M
}
