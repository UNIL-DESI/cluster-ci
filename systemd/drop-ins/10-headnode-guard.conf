[Service]
# Cluster-CI v3 (W11) - Headnode Service Hardening Drop-in
# Protects critical headnode control-plane processes from OOM kill and CPU starvation.

# 1. High immunity to OOM Killer: lower score = killed last (-1000 to +1000)
# Headnode services get -900, while job containers run with +500
OOMScoreAdjust=-900

# 2. CPU Priority: High weight guarantees scheduler/API execution even under 100% CPU job load
CPUWeight=1000
CPUShares=2048

# 3. Memory Protection: Guaranteed memory reserve prevents kernel page-cache starvation
MemoryMin=512M
MemoryLow=2G
