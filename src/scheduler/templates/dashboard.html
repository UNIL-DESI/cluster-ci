                    throw new Error('Impossible de charger les fichiers DVC les plus récents.');
                }
                const files = await resp.json();
                
                if (!files || files.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-info-circle text-muted fs-2 mb-2 d-block"></i>
                            <div class="text-slate-500">Aucun artefact (DVC) n'a été trouvé pour ${window._selectedBranch ? 'la branche <strong>' + escapeHtml(window._selectedBranch) + '</strong>' : 'le dernier run complété de ce projet'}.</div>
                        </div>
                    `;
                    const chipsContainer = document.getElementById('stage-filter-chips');
                    if (chipsContainer) chipsContainer.style.display = 'none';
                    return;
                }

                // Build stage filter chips
                const stages = [...new Set(files.map(f => f.stage).filter(Boolean))];
                const chipsContainer = document.getElementById('stage-filter-chips');
                if (chipsContainer && stages.length > 1) {
                    window._activeStageFilters = new Set();
                    chipsContainer.style.display = 'flex';
                    chipsContainer.innerHTML = stages.sort().map(stage => `
                        <button class="btn btn-sm rounded-pill border stage-chip" 
                                data-stage="${escapeHtml(stage)}" 
                                onclick="toggleStageChip(this)"
                                style="font-size: 0.8rem; font-weight: 500; padding: 4px 14px; background: #f1f5f9; color: #475569; border-color: #cbd5e1; transition: all 0.2s;">
                            <i class="bi bi-funnel me-1" style="font-size: 0.7rem;"></i>${escapeHtml(stage)}
                        </button>
                    `).join('');
                } else if (chipsContainer) {
                    chipsContainer.style.display = 'none';
                }

                // Determine the commit hash to use for artifact downloads
                let latestCommitHash = 'main';
                if (window.allRuns && window.allRuns.length > 0) {
                    // Find the most recent completed run (any branch)
                    const completedRun = window.allRuns.find(r => r.status === 'completed' && r.commit_hash);
                    if (completedRun) {
                        latestCommitHash = completedRun.commit_hash;
                    }
                }
                window.latestCommitHash = latestCommitHash;
                window._artifactFiles = files;
                window._artifactSortMode = window._artifactSortMode || 'tree';

                renderArtifactView(files, window._artifactSortMode);

            } catch (err) {
                container.innerHTML = `
                    <div class="alert alert-danger d-flex align-items-center gap-2">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <div>Erreur: ${err.message}</div>
                    </div>
                `;
            }
        }

        // Branch selector management
        window._selectedBranch = null;
        window._availableBranches = [];

        async function loadBranches(repo) {
            try {
                const resp = await fetch(`/api/projects/${repo}/branches`);
                if (!resp.ok) return;
                const branches = await resp.json();
                window._availableBranches = branches;

                const menu = document.getElementById('branch-dropdown-menu');
                if (!menu) return;

                const isAllSelected = !window._selectedBranch;
                let html = `<li><a class="dropdown-item ${isAllSelected ? 'active' : ''}" href="#" onclick="selectBranch(null); return false;"><i class="bi bi-globe me-2"></i>Toutes les branches</a></li>`;
                html += '<li><hr class="dropdown-divider"></li>';

                branches.forEach(b => {
                    const isActive = window._selectedBranch === b.name;
                    const dateStr = b.last_run ? new Date(b.last_run).toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
                    const isMain = b.name === 'main' || b.name === 'master';
                    const isDraft = b.name.startsWith('cluster-draft/');
                    const iconClass = isMain ? 'bi-shield-check text-success' : isDraft ? 'bi-lightning text-warning' : 'bi-diagram-2 text-primary';
                    html += `<li><a class="dropdown-item d-flex align-items-center gap-2 ${isActive ? 'active' : ''}" href="#" onclick="selectBranch('${escapeHtml(b.name).replace(/'/g, "\\\'")}'); return false;"><i class="bi ${iconClass}"></i><div class="d-flex flex-column"><span class="fw-medium">${escapeHtml(b.name)}</span>${dateStr ? '<small class="text-muted">' + dateStr + '</small>' : ''}</div></a></li>`;
                });

                menu.innerHTML = html;
            } catch (e) {
                console.error('Failed to load branches:', e);
            }
        }

        function selectBranch(branchName) {
            window._selectedBranch = branchName;
            // Update button text
            const btn = document.getElementById('artifact-branch-btn');
            if (btn) {
                if (branchName) {
                    const isDraft = branchName.startsWith('cluster-draft/');
                    const isMain = branchName === 'main' || branchName === 'master';
                    const iconClass = isMain ? 'bi-shield-check' : isDraft ? 'bi-lightning' : 'bi-diagram-2';
                    btn.innerHTML = `<i class="bi ${iconClass}"></i> ${escapeHtml(branchName)}`;
                    btn.classList.remove('btn-outline-primary');
                    btn.classList.add('btn-primary', 'text-white');
                } else {
                    btn.innerHTML = '<i class="bi bi-diagram-2"></i> Toutes les branches';
                    btn.classList.remove('btn-primary', 'text-white');
                    btn.classList.add('btn-outline-primary');
                }
            }
            // Reload artifacts with new branch filter
            if (currentState.repo) {
                loadProjectArtifacts(currentState.repo);
            }
        }

        function makeBranchBadge(branch) {
            if (!branch) return '';
            const isMain = branch === 'main' || branch === 'master';
            const isDraft = branch.startsWith('cluster-draft/');
            let bg, color, icon;
            if (isMain) {
                bg = '#dcfce7'; color = '#166534'; icon = 'bi-shield-check';
            } else if (isDraft) {
                bg = '#fef3c7'; color = '#92400e'; icon = 'bi-lightning';
            } else {
                bg = '#e0e7ff'; color = '#3730a3'; icon = 'bi-diagram-2';
            }
            const displayName = isDraft ? branch.replace('cluster-draft/', '⚡') : branch;
            return `<span class="badge rounded-pill ms-2" style="font-size:0.65rem;font-weight:600;padding:2px 8px;background:${bg};color:${color};" title="Branche: ${escapeHtml(branch)}"><i class="bi ${icon}" style="font-size:0.6rem;"></i> ${escapeHtml(displayName)}</span>`;
        }

        function renderArtifactView(files, mode) {
            const container = document.getElementById('artifacts-tree-container');
            if (!mode || mode === 'tree') {
                const treeRoot = buildTreeFromPaths(files);
                container.innerHTML = renderTreeNode(treeRoot);
                return;
            }

            // Flat sorted view
            let sorted = [...files];
            switch(mode) {
                case 'path-asc':  sorted.sort((a,b) => a.path.localeCompare(b.path)); break;
                case 'path-desc': sorted.sort((a,b) => b.path.localeCompare(a.path)); break;
                case 'name-asc':  sorted.sort((a,b) => a.path.split('/').pop().localeCompare(b.path.split('/').pop())); break;
                case 'name-desc': sorted.sort((a,b) => b.path.split('/').pop().localeCompare(a.path.split('/').pop())); break;
                case 'date-desc': sorted.sort((a,b) => (b.created_at || '').localeCompare(a.created_at || '')); break;
                case 'date-asc':  sorted.sort((a,b) => (a.created_at || '').localeCompare(b.created_at || '')); break;
            }

            const [owner, name] = currentState.repo.split('/');
            const rev = window.latestCommitHash || 'main';

            container.innerHTML = sorted.map(f => {
                const fileName = f.path.split('/').pop();
                const ext = fileName.split('.').pop().toLowerCase();
                let icon = 'bi-file-earmark-text';
                if (['png','jpg','jpeg','svg','webp'].includes(ext)) icon = 'bi-file-earmark-image';
                else if (ext === 'csv') icon = 'bi-file-earmark-spreadsheet';
                else if (['json','yaml','yml'].includes(ext)) icon = 'bi-file-earmark-code';

                const dateStr = f.created_at ? new Date(f.created_at).toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
                const downloadUrl = `/artifacts/${owner}/${name}/${rev}/${encodeURIComponent(f.path)}`;
                const stageBadge = f.stage ? `<span class="badge rounded-pill ms-2" style="font-size:0.7rem;font-weight:500;padding:2px 8px;background:${f.artifact_type==='metric'?'#dbeafe':'#dcfce7'};color:${f.artifact_type==='metric'?'#1e40af':'#166534'};">${escapeHtml(f.stage)}</span>` : '';
                const branchBadge = makeBranchBadge(f.branch);

                return `
                    <div class="artifact-tree-item file-node d-flex align-items-center justify-content-between py-2 px-3 my-1 rounded"
                         style="cursor:pointer;background:#fff;"
                         onclick="previewFile('${downloadUrl}','${escapeHtml(f.path).replace(/'/g,"\\\'")}',${f.size||0})"
                         data-path="${escapeHtml(f.path).toLowerCase()}"
                         data-stage="${escapeHtml(f.stage||'')}">
                        <div class="d-flex align-items-center text-truncate">
                            <i class="bi ${icon} text-primary me-2 fs-5"></i>
                            <span class="file-name text-slate-700 font-medium">${escapeHtml(f.path)}</span>
                            ${stageBadge}
                            ${branchBadge}
                        </div>
                        <span class="badge bg-slate-100 text-slate-500 rounded-pill font-normal small">${dateStr}</span>
                    </div>
                `;
            }).join('');
        }

        function sortArtifacts(mode) {
            window._artifactSortMode = mode;
            if (window._artifactFiles) {
                renderArtifactView(window._artifactFiles, mode);
                // Update button label
                const labels = {'path-asc':'Path A→Z','path-desc':'Path Z→A','name-asc':'Nom A→Z','name-desc':'Nom Z→A','date-desc':'Récent','date-asc':'Ancien'};
                const btn = document.getElementById('artifact-sort-btn');
                if (btn) btn.innerHTML = `<i class="bi bi-sort-down"></i> ${labels[mode] || 'Trier'}`;
            }
        }

        function buildTreeFromPaths(files) {
            const root = { name: 'Root', isDir: true, children: {}, path: '' };

            files.forEach(file => {
                const parts = file.path.split('/');
                let current = root;
                let cumulativePath = '';

                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    cumulativePath = cumulativePath ? cumulativePath + '/' + part : part;
                    const isLast = (i === parts.length - 1);

                    if (isLast) {
                        current.children[part] = {
                            name: part,
                            isDir: false,
                            path: file.path,
                            size: file.size,
                            isout: file.isout,
                            createdAt: file.created_at,
                            stage: file.stage || '',
                            artifactType: file.artifact_type || '',
                            branch: file.branch || ''
                        };
                    } else {
                        if (!current.children[part]) {
                            current.children[part] = {
                                name: part,
                                isDir: true,
                                children: {},
                                path: cumulativePath
                            };
                        }
                        current = current.children[part];
                    }
                }
            });

            return root;
        }

        function renderTreeNode(node, depth = 0) {
            if (!node.isDir) {
                const ext = node.name.split('.').pop().toLowerCase();
                let icon = 'bi-file-earmark-text';
                if (['png', 'jpg', 'jpeg', 'svg', 'webp'].includes(ext)) icon = 'bi-file-earmark-image';
                else if (ext === 'csv') icon = 'bi-file-earmark-spreadsheet';
                else if (['json', 'yaml', 'yml'].includes(ext)) icon = 'bi-file-earmark-code';

                const sizeStr = node.size ? formatBytes(node.size) : (node.createdAt ? new Date(node.createdAt).toLocaleString('fr-FR', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'}) : '—');
                const [owner, name] = currentState.repo.split('/');
                const rev = window.latestCommitHash || 'main';
                const downloadUrl = `/artifacts/${owner}/${name}/${rev}/${encodeURIComponent(node.path)}`;

                const stageBadge = node.stage ? `<span class="badge rounded-pill ms-2" style="font-size: 0.7rem; font-weight: 500; padding: 2px 8px; background: ${node.artifactType === 'metric' ? '#dbeafe' : node.artifactType === 'plot' ? '#dcfce7' : '#f1f5f9'}; color: ${node.artifactType === 'metric' ? '#1e40af' : node.artifactType === 'plot' ? '#166534' : '#475569'};">${escapeHtml(node.stage)}</span>` : '';
                const branchBadge = makeBranchBadge(node.branch);

                return `
                    <div class="artifact-tree-item file-node d-flex align-items-center justify-content-between py-2 px-3 my-1 rounded" 
                         style="margin-left: ${depth * 15}px; cursor: pointer; background: #fff;" 
                         onclick="previewFile('${downloadUrl}', '${escapeHtml(node.path).replace(/'/g, "\\'")}', ${node.size || 0})"
                         data-path="${escapeHtml(node.path).toLowerCase()}"
                         data-stage="${escapeHtml(node.stage || '')}">
                        <div class="d-flex align-items-center text-truncate">
                            <i class="bi ${icon} text-primary me-2 fs-5"></i>
                            <span class="file-name text-slate-700 font-medium text-truncate">${escapeHtml(node.name)}</span>
                            ${stageBadge}
                            ${branchBadge}
                        </div>
                        <span class="badge bg-slate-100 text-slate-500 rounded-pill font-normal small">${sizeStr}</span>
                    </div>
                `;
            }

            const childrenHtml = Object.values(node.children)
                .sort((a, b) => {
                    if (a.isDir && !b.isDir) return -1;
                    if (!a.isDir && b.isDir) return 1;
                    return a.name.localeCompare(b.name);
                })
                .map(child => renderTreeNode(child, depth + 1))
                .join('');

            if (node.name === 'Root') {
                return childrenHtml;
            }

            const folderId = `folder-${node.path.replace(/[^a-zA-Z0-9]/g, '-')}`;

            return `
                <div class="artifact-folder-node" data-path="${escapeHtml(node.path).toLowerCase()}">
                    <div class="artifact-tree-item folder-header d-flex align-items-center py-2 px-3 my-1 rounded" 
                         style="margin-left: ${depth * 15}px; cursor: pointer; background: rgba(248, 250, 252, 0.7);" 
                         onclick="toggleFolder('${folderId}')">
                        <i class="bi bi-chevron-down chevron-icon me-2 text-slate-400" id="${folderId}-chevron"></i>
                        <i class="bi bi-folder-fill text-amber-500 me-2 fs-5" id="${folderId}-icon"></i>
                        <span class="folder-name text-slate-800 font-bold text-truncate">${escapeHtml(node.name)}</span>
                    </div>
                    <div id="${folderId}-children" class="folder-children show">
                        ${childrenHtml}
                    </div>
                </div>
            `;
        }

        function toggleFolder(folderId) {
            const childrenDiv = document.getElementById(`${folderId}-children`);
            const chevron = document.getElementById(`${folderId}-chevron`);
            const icon = document.getElementById(`${folderId}-icon`);

            if (childrenDiv.classList.contains('show')) {
                childrenDiv.classList.remove('show');
                childrenDiv.style.display = 'none';
                chevron.classList.replace('bi-chevron-down', 'bi-chevron-right');
                icon.classList.replace('bi-folder-fill', 'bi-folder');
            } else {
                childrenDiv.classList.add('show');
                childrenDiv.style.display = 'block';
                chevron.classList.replace('bi-chevron-right', 'bi-chevron-down');
                icon.classList.replace('bi-folder', 'bi-folder-fill');
            }
        }

        function filterArtifacts(query) {
            applyAllArtifactFilters();
        }

        function toggleStageChip(btn) {
            const stage = btn.getAttribute('data-stage');
            if (!window._activeStageFilters) window._activeStageFilters = new Set();

            if (window._activeStageFilters.has(stage)) {
                window._activeStageFilters.delete(stage);
                btn.style.background = '#f1f5f9';
                btn.style.color = '#475569';
                btn.style.borderColor = '#cbd5e1';
            } else {
                window._activeStageFilters.add(stage);
                btn.style.background = '#3b82f6';
                btn.style.color = '#fff';
                btn.style.borderColor = '#3b82f6';
            }

            applyAllArtifactFilters();
        }

        function applyAllArtifactFilters() {
            const searchInput = document.getElementById('artifact-search');
            const q = searchInput ? searchInput.value.toLowerCase().trim() : '';
            const activeStages = window._activeStageFilters || new Set();
            const hasStageFilter = activeStages.size > 0;

            const fileNodes = document.querySelectorAll('.file-node');
            fileNodes.forEach(node => {
                const path = node.getAttribute('data-path');
                const stage = node.getAttribute('data-stage') || '';
                const matchesText = !q || path.includes(q);
                const matchesStage = !hasStageFilter || activeStages.has(stage);
                if (matchesText && matchesStage) {
                    node.style.setProperty('display', 'flex', 'important');
                } else {
                    node.style.setProperty('display', 'none', 'important');
                }
            });

            // Update folder visibility
            const folderNodes = Array.from(document.querySelectorAll('.artifact-folder-node'));
            folderNodes.sort((a, b) => {
                const aDepth = (a.getAttribute('data-path').match(/\//g) || []).length;
                const bDepth = (b.getAttribute('data-path').match(/\//g) || []).length;
                return bDepth - aDepth;
            });

            folderNodes.forEach(folder => {
                const childrenContainer = folder.querySelector('.folder-children');
                if (childrenContainer) {
                    const hasVisibleFiles = Array.from(childrenContainer.children).some(child => {
                        if (child.classList.contains('file-node')) return child.style.display !== 'none';
                        if (child.classList.contains('artifact-folder-node')) return child.style.display !== 'none';
                        return false;
                    });

                    if (hasVisibleFiles) {
                        folder.style.setProperty('display', 'block', 'important');
                        if (q || hasStageFilter) {
                            const folderId = childrenContainer.id.replace('-children', '');
                            const chevron = document.getElementById(`${folderId}-chevron`);
                            const icon = document.getElementById(`${folderId}-icon`);
                            childrenContainer.classList.add('show');
                            childrenContainer.style.display = 'block';
                            if (chevron) chevron.classList.replace('bi-chevron-right', 'bi-chevron-down');
                            if (icon) icon.classList.replace('bi-folder', 'bi-folder-fill');
                        }
                    } else {
                        folder.style.setProperty('display', 'none', 'important');
                    }
                }
            });
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0 || !bytes) return '0 Octets';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Octets', 'Ko', 'Mo', 'Go', 'To', 'Po', 'Eo', 'Zo', 'Yo'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function navigateToRoot() {
            loadProjects();
        }

        async function loadRunDetails(jobId, status, repo, branch, commitHash, createdAt, subPath = '') {
            currentState = { view: 'run', repo: repo, jobId: jobId, branch: branch, commitHash: commitHash, createdAt: createdAt, subPath: subPath };
            updateBreadcrumb();
            container.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>';

            if (!commitHash && status !== 'running') {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="card shadow-sm p-5 border-warning">
                            <h3><i class="bi bi-exclamation-triangle text-warning"></i> Run Details Unavailable</h3>
                            <p class="text-muted">This run does not have an associated commit hash. It may have failed to start or was interrupted before committing its state.</p>
                        </div>
                    </div>
                `;
                return;
            }

            if (status === 'running') {
                const [owner, name] = repo.split('/');
                const currentRun = window.allRuns.find(r => r.job_id === jobId);
                const isCustom = currentRun && currentRun.custom_web_app;
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="card shadow-sm p-5">
                            <h3>Run is currently in progress</h3>
                            <p class="text-muted">Files are being processed and are not yet pushed to the headnode.</p>
                            <a href="/view/${encodeURIComponent(owner)}/${encodeURIComponent(name)}/" class="btn btn-primary btn-lg mt-3">
                                <i class="bi bi-broadcast"></i> ${isCustom ? 'Open Web Application' : 'Open Live DVC-Viewer'}
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            try {
                const filesUrl = `/api/runs/${jobId}/files` + (subPath ? `?path=${encodeURIComponent(subPath)}` : '');
                const resp = await fetch(filesUrl);
                if (!resp.ok) {
                    const contentType = resp.headers.get('content-type');
                    let error = 'Internal Server Error'; try { if (contentType && contentType.includes('application/json')) { const data = await resp.json(); error = data.error || data.message || error; } else { error = 'Server returned ' + resp.status + ' (' + resp.statusText + ')'; } } catch(e) { console.error('Error parsing failure response:', e); error = 'Parse Error: ' + e.message; }
                    throw new Error(error || 'Failed to load files');
                }
                const files = await resp.json();

                if (files.length === 0) {
                    container.innerHTML = '<div class="col-12"><div class="alert alert-info">No files found for this run.</div></div>';
                    return;
                }

                container.innerHTML = '';
                // Render files/dirs
                files.forEach(item => {
                    const col = document.createElement('div');
                    col.className = 'col';

                    // Use DVC's native 'isdir' field from JSON output
                    const isDir = item.isdir === true;
                    const iconClass = isDir ? 'bi-folder-fill folder-icon' : 'bi-file-earmark-text-fill file-icon';

                    // Construct download link using commit hash if available for consistency
                    const [owner, name] = repo.split('/');
                    const rev = currentState.commitHash || currentState.branch || 'main';
                    // Build full path for subfolder-aware download URL
                    const fullFilePath = subPath ? subPath + '/' + item.path.replace(/\/$/, '') : item.path.replace(/\/$/, '');
                    const downloadUrl = `/artifacts/${owner}/${name}/${rev}/${encodeURIComponent(fullFilePath)}`;

                    const card = document.createElement('div');
                    card.className = 'card h-100 explorer-item shadow-sm';
                    if (isDir) {
                        const dirPath = subPath ? subPath + '/' + item.path.replace(/\/$/, '') : item.path.replace(/\/$/, '');
                        card.onclick = () => navigateToSubPath(dirPath);
                    } else {
                        card.onclick = () => previewFile(downloadUrl, fullFilePath, item.size || 0);
                    }

                    const icon = document.createElement('i');
                    icon.className = 'bi ' + iconClass + ' explorer-icon';

                    const title = document.createElement('h6');
                    title.className = 'card-title text-truncate';
                    title.textContent = item.path;
                    title.title = item.path;

                    const info = document.createElement('small');
                    info.className = 'text-muted';
                    info.textContent = item.size ? (item.size / 1024).toFixed(1) + ' KB' : (isDir ? 'Directory' : 'Tracked File');

                    card.appendChild(icon);
                    card.appendChild(title);
                    card.appendChild(info);
                    col.appendChild(card);

                    container.appendChild(col);
                });
            } catch (err) {
                container.innerHTML = `<div class="col-12"><div class="alert alert-danger">Error loading run details: ${err.message}</div></div>`;
            }
        }

        function navigateToProject(repo) {
            loadRuns(repo);
        }

        function navigateToRun(jobId, status, repo, branch, commitHash, createdAt) {
            loadRunDetails(jobId, status, repo, branch, commitHash, createdAt, '');
        }

        function navigateToSubPath(subPath) {
            loadRunDetails(
                currentState.jobId,
                'completed', // Only completed runs can browse files
                currentState.repo,
                currentState.branch,
                currentState.commitHash,
                currentState.createdAt,
                subPath
            );
        }

        async function loadClusterStats() {
            try {
                const resp = await fetch('/workers');
                const workers = await resp.json();
                const activeResp = await fetch('/api/runs/active');
                const activeRuns = await activeResp.json();
                
                const statsContainer = document.getElementById('cluster-stats-container');
                if (!statsContainer) return;

                const onlineWorkers = workers.filter(w => w.status === 'online');
                
                if (onlineWorkers.length === 0) {
                    statsContainer.innerHTML = '<div class="alert alert-warning">No online workers available in the cluster.</div>';
                    return;
                }

                let html = '<h4 class="mb-3 text-secondary"><i class="bi bi-hdd-network"></i> Cluster Workers</h4><div class="row row-cols-1 row-cols-lg-2 g-4 mb-4">';

                onlineWorkers.forEach(w => {
                    const ramTotal = w.total_ram_gb || 0;
                    const ramAvail = w.available_ram_gb || 0;
                    const storageTotal = w.total_storage_gb || 0;
                    const storageAvail = w.available_storage_gb || 0;
                    
                    const ramUsedPercent = ramTotal > 0 ? ((ramTotal - ramAvail) / ramTotal * 100).toFixed(1) : 0;
                    const storageUsedPercent = storageTotal > 0 ? ((storageTotal - storageAvail) / storageTotal * 100).toFixed(1) : 0;

                    // VRAM calculations (only relevant when GPU is present)
                    const vramUsed = (w.total_vram_gb || 0) - (w.available_vram_gb || 0);
                    const vramUsedPercent = w.total_vram_gb > 0 ? (vramUsed / w.total_vram_gb * 100).toFixed(1) : 0;
                    const vramColor = vramUsedPercent >= 85 ? 'bg-danger' : (vramUsedPercent >= 60 ? 'bg-warning' : 'bg-success');
                    
                    const workerJobs = activeRuns.filter(r => r.worker_id === w.worker_id);
                    
                    let jobsHtml = '';
                    if (workerJobs.length > 0) {
                        jobsHtml = '<div class="mt-3"><h6 class="text-primary"><i class="bi bi-activity"></i> Active Jobs</h6><ul class="list-group list-group-flush small">';
                        workerJobs.forEach(j => {
                            const userStr = j.username ? escapeHtml(j.username) : 'Unknown User';
                            const repoStr = escapeHtml(j.repo);
                            jobsHtml += `<li class="list-group-item px-0 pb-1 pt-1 bg-transparent border-0 d-flex justify-content-between align-items-center">
                                <div><i class="bi bi-person"></i> <strong>${userStr}</strong><br><i class="bi bi-folder"></i> ${repoStr}</div>
                                <span class="badge bg-secondary rounded-pill">${j.ram_required_gb} GB</span>
                            </li>`;
                        });
                        jobsHtml += '</ul></div>';
                    } else {
                        jobsHtml = '<div class="mt-3 text-muted small">No active jobs.</div>';
                    }

                    // Build conditional VRAM progress bar HTML
                    const vramBarHtml = w.total_vram_gb > 0 ? `
                                    <div class="mb-2">
                                        <div class="d-flex justify-content-between mb-1 small">
                                            <span class="fw-bold text-muted">VRAM</span>
                                            <span>${vramUsed.toFixed(1)} / ${w.total_vram_gb.toFixed(1)} GB (${vramUsedPercent}%)</span>
                                        </div>
                                        <div class="progress" style="height: 8px;">
                                            <div class="progress-bar ${vramColor}" 
                                                 style="width: ${vramUsedPercent}%"></div>
                                        </div>
                                    </div>` : '';

                    html += `
                        <div class="col">
                            <div class="card shadow-sm h-100 border-0" style="background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);">
                                <div class="card-body">
                                    <h5 class="card-title text-dark"><i class="bi bi-pc-display-horizontal"></i> ${escapeHtml(w.hostname || w.worker_id.substring(0,8))}</h5>
                                    ${w.gpu_name ? `<div class="small text-muted mb-1"><i class="bi bi-gpu-card me-1"></i>${escapeHtml(w.gpu_name)}${w.total_vram_gb ? ` — ${Math.round(w.total_vram_gb)} GB VRAM${w.gpu_count > 1 ? '/GPU' : ''}` : ''}</div>` : ''}
                                    <hr class="my-2">
                                    <div class="mb-2">
                                        <div class="d-flex justify-content-between mb-1 small">
                                            <span class="fw-bold text-muted">RAM</span>
                                            <span>${(ramTotal - ramAvail).toFixed(1)} / ${ramTotal.toFixed(1)} GB (${ramUsedPercent}%)</span>
                                        </div>
                                        <div class="progress" style="height: 8px;">
                                            <div class="progress-bar ${ramUsedPercent > 80 ? 'bg-danger' : (ramUsedPercent > 60 ? 'bg-warning' : 'bg-success')}" 
                                                 style="width: ${ramUsedPercent}%"></div>
                                        </div>
                                    </div>
                                    ${vramBarHtml}
                                    <div>
                                        <div class="d-flex justify-content-between mb-1 small">
                                            <span class="fw-bold text-muted">STORAGE</span>
                                            <span>${(storageTotal - storageAvail).toFixed(1)} / ${storageTotal.toFixed(1)} GB (${storageUsedPercent}%)</span>
                                        </div>
                                        <div class="progress" style="height: 8px;">
                                            <div class="progress-bar ${storageUsedPercent > 80 ? 'bg-danger' : (storageUsedPercent > 60 ? 'bg-warning' : 'bg-success')}" 
                                                 style="width: ${storageUsedPercent}%"></div>
                                        </div>
                                    </div>
                                    ${jobsHtml}
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += '</div>';
                statsContainer.innerHTML = html;
            } catch (err) {
                console.error("Failed to load cluster stats", err);
            }
        }

        // ── Log Segmentation Engine ──────────────────────────────────────
        let logPollingInterval = null;
        let lastLogOffset = 0;
        let fullLogBuffer = '';
        let currentSelectedStage = null;

        // Lazy rendering state
        const LOG_CHUNK_SIZE = 300; // lines per chunk
        const MAX_DISPLAY_LINES = 500; // sliding window max
        let currentSectionLines = []; // full lines array for active section
        let renderedLineCount = 0;

        const STAGE_META = {
            setup:     { label: 'Setup',           icon: 'bi-gear-fill' },
            dvc_repro: { label: 'DVC Pipeline',    icon: 'bi-play-circle-fill' },
            sync:      { label: 'Sync & GC',       icon: 'bi-cloud-upload-fill' },
        };

        const ERROR_PATTERNS   = /\berror\b|❌|\bfailed\b|\bFATAL\b|\bTraceback\b|\bException\b|Error:|exit code [1-9]/i;
        const WARNING_PATTERNS = /\bwarning\b|⚠️|\bWARN\b|\bdeprecated\b/i;
        const SUCCESS_PATTERNS = /✅|\bcompleted successfully\b|\bsuccess\b/i;
        const KILL_PATTERNS = [
            { pattern: /Exit code 137|OOM|Out of Memory|exited with -9/i, reason: 'OOM Kill' },
            { pattern: /CLUSTER INTERRUPTED/i, reason: 'Interrupted' },
            { pattern: /zombie/i, reason: 'Zombie cleanup' },
            { pattern: /cancel/i, reason: 'Cancelled' },
            { pattern: /SIGTERM|SIGKILL|signal|error code 255/i, reason: 'Killed' },
            { pattern: /didn.t change, skipping/i, reason: null }, // Not a kill
        ];

        function classifySection(content, isInProgress) {
            if (isInProgress) return 'running';
            if (ERROR_PATTERNS.test(content)) return 'error';
            if (WARNING_PATTERNS.test(content)) return 'warning';
            if (SUCCESS_PATTERNS.test(content)) return 'success';
            return 'neutral';
        }

        function getKillReason(content) {
            for (const { pattern, reason } of KILL_PATTERNS) {
                if (reason && pattern.test(content)) return reason;
            }
            return null;
        }

        function parseLogSections(rawText) {
            const sections = [];
            
            const addOrMergeSection = (newSec) => {
                const existing = sections.find(s => s.id === newSec.id);
                if (existing) {
                    existing.content += '\n\n' + newSec.content;
                    const statusPrecedence = { error: 4, warning: 3, running: 2, success: 1, neutral: 0 };
                    if (statusPrecedence[newSec.status] > statusPrecedence[existing.status]) {
                        existing.status = newSec.status;
                    }
                } else {
                    sections.push(newSec);
                }
            };

            const stageRegex = /===STAGE:(\w+):(BEGIN|END)===/g;
            let matches = [];
            let match;
            while ((match = stageRegex.exec(rawText)) !== null) {
                matches.push({ name: match[1], type: match[2], index: match.index, fullMatch: match[0] });
            }

            if (matches.length === 0) {
                // Fallback: no markers found (legacy logs)
                addOrMergeSection({
                    id: 'full_log',
                    label: 'Full Log',
                    icon: 'bi-file-text-fill',
                    content: rawText,
                    status: classifySection(rawText)
                });
                return sections;
            }

            // Content before first marker
            const preamble = rawText.substring(0, matches[0].index).trim();
            if (preamble) {
                addOrMergeSection({
                    id: 'preamble',
                    label: 'Init',
                    icon: 'bi-rocket-takeoff-fill',
                    content: preamble,
                    status: classifySection(preamble, false)
                });
            }

            // Parse BEGIN/END pairs
            for (let i = 0; i < matches.length; i++) {
                const m = matches[i];
                if (m.type !== 'BEGIN') continue;

                // Find matching END
                const endMatch = matches.find((e, j) => j > i && e.name === m.name && e.type === 'END');
                const isInProgress = !endMatch;
                const contentStart = m.index + m.fullMatch.length;
                const contentEnd = endMatch ? endMatch.index : rawText.length;
                const stageContent = rawText.substring(contentStart, contentEnd).trim();

                const meta = STAGE_META[m.name] || { label: m.name, icon: 'bi-circle' };

                if (m.name === 'dvc_repro') {
                    // Parse DVC sub-stages from the pipeline output
                    const subStages = parseDvcSubStages(stageContent, isInProgress);
                    if (subStages.length > 1) {
                        subStages.forEach(sub => addOrMergeSection(sub));
                    } else {
                        addOrMergeSection({
                            id: m.name,
                            label: meta.label,
                            icon: meta.icon,
                            content: stageContent,
                            status: classifySection(stageContent, isInProgress)
                        });
                    }
                } else {
                    addOrMergeSection({
                        id: m.name,
                        label: meta.label,
                        icon: meta.icon,
                        content: stageContent,
                        status: classifySection(stageContent, isInProgress)
                    });
                }
            }

            // Content after last marker — only if last marker is an END (not mid-stage)
            const lastMatch = matches[matches.length - 1];
            if (lastMatch.type === 'END') {
                const epilogue = rawText.substring(lastMatch.index + lastMatch.fullMatch.length).trim();
                if (epilogue) {
                    // Check for kill patterns in the FULL text, since the kill might have occurred during a stage
                    const killReason = getKillReason(rawText);
                    // Only say Post-Run if the last marker was sync:END (i.e. truly finished)
                    const isTrulyFinished = (lastMatch.name === 'sync' || lastMatch.name === 'teardown');
                    const defaultLabel = isTrulyFinished ? 'Post-Run' : 'System';
                    
                    addOrMergeSection({
                        id: 'epilogue',
                        label: killReason ? `☠️ ${killReason}` : defaultLabel,
                        icon: killReason ? 'bi-x-octagon-fill' : 'bi-terminal',
                        content: epilogue,
                        status: classifySection(epilogue, !isTrulyFinished)
                    });
                }
            }

            return sections;
        }

        function parseDvcSubStages(dvcContent, parentIsInProgress) {
            // DVC outputs lines like: Running stage 'step_xxx':
            const stagePattern = /Running stage '([^']+)':/g;
            const stageMatches = [];
            let m;
            while ((m = stagePattern.exec(dvcContent)) !== null) {
                stageMatches.push({ name: m[1], index: m.index });
            }

            if (stageMatches.length === 0) return [{
                id: 'dvc_repro',
                label: 'DVC Pipeline',
                icon: 'bi-play-circle-fill',
                content: dvcContent,
                status: classifySection(dvcContent, parentIsInProgress)
            }];

            const sections = [];

            // Content before first DVC stage (dep install etc.)
            const preStage = dvcContent.substring(0, stageMatches[0].index).trim();
            if (preStage) {
                sections.push({
                    id: 'dvc_pre',
                    label: 'Deps Install',
                    icon: 'bi-download',
                    content: preStage,
                    status: classifySection(preStage, false)
                });
            }

            for (let i = 0; i < stageMatches.length; i++) {
                const isLastSubStage = (i === stageMatches.length - 1);
                const subStageInProgress = parentIsInProgress && isLastSubStage;
                const start = stageMatches[i].index;
                const end = i + 1 < stageMatches.length ? stageMatches[i + 1].index : dvcContent.length;
                const content = dvcContent.substring(start, end).trim();
                const stageName = stageMatches[i].name;
                const sectionId = 'dvc_' + stageName;

                // Check if we already have a section for this stage
                const existing = sections.find(s => s.id === sectionId);
                const currentStatus = classifySection(content, subStageInProgress);

                if (existing) {
                    // Append content to existing section
                    existing.content += '\n\n' + content;
                    // Propagate more critical statuses (error > warning > running > success > neutral)
                    const statusPrecedence = { error: 4, warning: 3, running: 2, success: 1, neutral: 0 };
                    if (statusPrecedence[currentStatus] > statusPrecedence[existing.status]) {
                        existing.status = currentStatus;
                    }
                } else {
                    // Prettify label: step_format -> Format, step_train -> Train, etc.
                    let prettyLabel = stageName;
                    if (stageName.startsWith('step_')) {
                        prettyLabel = stageName.replace('step_', '').replace(/_/g, ' ');
                        prettyLabel = prettyLabel.charAt(0).toUpperCase() + prettyLabel.slice(1);
                    }

                    sections.push({
                        id: sectionId,
                        label: prettyLabel,
                        icon: 'bi-play-circle',
                        content: content,
                        status: currentStatus
                    });
                }
            }

            return sections;
        }

        function renderLogStageGrid(sections, isFinished) {
            const grid = document.getElementById('log-stage-grid');
            grid.innerHTML = '';

            // Add "All" button
            const allBtn = document.createElement('button');
            allBtn.className = `log-stage-btn status-neutral ${currentSelectedStage === '__all__' ? 'active' : ''}`;
            allBtn.innerHTML = `<i class="bi bi-file-text-fill"></i> Raw Log`;
            allBtn.onclick = (e) => selectStage('__all__', sections, e);
            grid.appendChild(allBtn);

            sections.forEach(section => {
                const btn = document.createElement('button');
                const isActive = currentSelectedStage === section.id;
                btn.className = `log-stage-btn status-${section.status} ${isActive ? 'active' : ''}`;
                btn.innerHTML = `<i class="bi ${section.icon}"></i> ${escapeHtml(section.label)}`;
                btn.title = section.label;
                btn.onclick = (e) => selectStage(section.id, sections, e);
                grid.appendChild(btn);
            });

            // Add "Last Error" button if job is finished and any section has error status
            const hasError = sections.some(s => s.status === 'error');
            if (isFinished && hasError) {
                const errBtn = document.createElement('button');
                const isActive = currentSelectedStage === '__last_error__';
                errBtn.className = `log-stage-btn status-error ${isActive ? 'active' : ''}`;
                errBtn.innerHTML = `<i class="bi bi-exclamation-triangle-fill"></i> Last Error`;
                errBtn.title = 'Show the logs of the failed stage';
                errBtn.onclick = (e) => selectStage('__last_error__', sections, e);
                grid.appendChild(errBtn);
            }
        }

        function isUserAtBottom() {
            const modalBody = document.querySelector('#logModal .modal-body');
            if (!modalBody) return true;
            // Consider "at bottom" if within 50px of the end
            return (modalBody.scrollHeight - modalBody.scrollTop - modalBody.clientHeight) < 50;
        }

        function selectStage(stageId, sections, evt) {
            currentSelectedStage = stageId;
            const content = getStageContent(stageId, sections);
            renderLogContent(content, true);

            // Update active button state
            document.querySelectorAll('.log-stage-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');

            // Scroll to top on explicit user click (they chose a new section)
            const modalBody = document.querySelector('#logModal .modal-body');
            modalBody.scrollTop = 0;
        }

        function getStageContent(stageId, sections) {
            if (stageId === '__all__') return fullLogBuffer;
            if (stageId === '__last_error__') {
                const errorSections = sections ? sections.filter(s => s.status === 'error') : [];
                if (errorSections.length > 0) {
                    return errorSections[errorSections.length - 1].content;
                }
                return fullLogBuffer.split('\n').slice(-100).join('\n');
            }
            const section = sections ? sections.find(s => s.id === stageId) : null;
            return section ? section.content : '';
        }

        function renderLogContent(content, reset) {
            let allLines = content.split('\n');
            const totalLines = allLines.length;

            // Sliding window: keep only the last MAX_DISPLAY_LINES
            const windowStart = Math.max(0, totalLines - MAX_DISPLAY_LINES);
            currentSectionLines = allLines.slice(windowStart);

            const logContent = document.getElementById('log-content');

            if (reset) {
                renderedLineCount = 0;
            }

            if (currentSectionLines.length <= LOG_CHUNK_SIZE) {
                // Small content: render everything at once
                logContent.textContent = currentSectionLines.join('\n');
                renderedLineCount = currentSectionLines.length;
            } else {
                // Large content: render first chunk only
                const end = Math.min(renderedLineCount + LOG_CHUNK_SIZE, currentSectionLines.length);
                logContent.textContent = currentSectionLines.slice(0, end).join('\n');
                renderedLineCount = end;
            }

            updateLineIndicator(windowStart, totalLines);
        }

        function loadMoreLogLines() {
            if (renderedLineCount >= currentSectionLines.length) return;

            const logContent = document.getElementById('log-content');
            const end = Math.min(renderedLineCount + LOG_CHUNK_SIZE, currentSectionLines.length);
            const nextChunk = currentSectionLines.slice(renderedLineCount, end);
            logContent.textContent += '\n' + nextChunk.join('\n');
            renderedLineCount = end;

            updateLineIndicator(0, currentSectionLines.length);
        }

        function updateLineIndicator(windowStart, totalLines) {
            const indicator = document.getElementById('log-line-indicator');
            if (!indicator) return;
            const total = currentSectionLines.length;
            if (windowStart > 0) {
                indicator.textContent = `Lignes ${windowStart + 1}–${totalLines} (${MAX_DISPLAY_LINES} dernières sur ${totalLines})`;
            } else if (renderedLineCount >= total) {
                indicator.textContent = `${total} lines`;
            } else {
                indicator.textContent = `${renderedLineCount} / ${total} lines ↓`;
            }
        }

        function copyLogs() {
            // Always copy the FULL section content, not just the rendered portion
            const sections = parseLogSections(fullLogBuffer);
            const text = getStageContent(currentSelectedStage, sections) || '';
            
            if (!text) {
                console.warn('copyLogs: no text to copy (empty section or no stage selected)');
                return;
            }

            const handleSuccess = () => {
                const btn = document.querySelector('.btn-copy-logs');
                if (!btn) return;
                btn.classList.add('copied');
                btn.innerHTML = '<i class="bi bi-check-lg"></i> Copié !';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = '<i class="bi bi-clipboard"></i> Copier';
                }, 2000);
            };

            const fallbackCopy = (txt) => {
                // CRITICAL: Append textarea INSIDE the modal, not document.body.
                // Bootstrap modals trap focus — elements outside the modal cannot receive focus,
                // which silently breaks textarea.select() and document.execCommand('copy').
                const modalEl = document.getElementById('logModal');
                const container = modalEl || document.body;
                
                const textArea = document.createElement('textarea');
                textArea.value = txt;
                // Position off-screen but still inside the modal's DOM tree
                textArea.style.position = 'fixed';
                textArea.style.top = '0';
                textArea.style.left = '0';
                textArea.style.width = '1px';
                textArea.style.height = '1px';
                textArea.style.padding = '0';
                textArea.style.border = 'none';
                textArea.style.outline = 'none';
                textArea.style.boxShadow = 'none';
                textArea.style.background = 'transparent';
                textArea.style.opacity = '0.01';
                container.appendChild(textArea);
                textArea.focus();
                textArea.select();
                // Also set selection range explicitly for iOS/mobile compatibility
                textArea.setSelectionRange(0, txt.length);
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        handleSuccess();
                    } else {
                        console.error('Fallback copy command returned false');
                    }
                } catch (err) {
                    console.error('Fallback copy failed:', err);
                }
                container.removeChild(textArea);
            };

            // In secure contexts (HTTPS or localhost), prefer the modern async Clipboard API.
            // In insecure contexts (HTTP), the Clipboard API is unavailable,
            // so we MUST use the synchronous fallback immediately during the click event.
            if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    handleSuccess();
                }).catch(err => {
                    console.warn('Clipboard API failed, trying fallback:', err);
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function showLogs(jobId) {
            const logModal = new bootstrap.Modal(document.getElementById('logModal'));
            const logContent = document.getElementById('log-content');
            logContent.textContent = 'Connecting to worker for logs...';
            document.getElementById('log-stage-grid').innerHTML = '';
            document.getElementById('log-line-indicator').textContent = '';
            fullLogBuffer = '';
            lastLogOffset = 0;
            currentSelectedStage = null;
            currentSectionLines = [];
            renderedLineCount = 0;

            if (logPollingInterval) clearInterval(logPollingInterval);

            logModal.show();

            // Attach scroll listener for lazy loading
            const modalBody = document.querySelector('#logModal .modal-body');
            modalBody.onscroll = () => {
                if (modalBody.scrollHeight - modalBody.scrollTop - modalBody.clientHeight < 150) {
                    loadMoreLogLines();
                }
            };

            const logElement = document.getElementById('logModal');
            logElement.addEventListener('hidden.bs.modal', () => {
                if (logPollingInterval) {
                    clearInterval(logPollingInterval);
                    logPollingInterval = null;
                }
                modalBody.onscroll = null;
            }, { once: true });

            pollLogs(jobId);
            logPollingInterval = setInterval(() => pollLogs(jobId), 2000);
        }

        async function stopJob(jobId) {
            if (!confirm('Are you sure you want to stop this job and cancel the associated GitHub workflow?')) return;

            try {
                const resp = await fetch(`/api/jobs/${jobId}/stop`, { method: 'POST' });
                if (resp.ok) {
                    alert('Stop signal sent successfully.');
                    window.location.reload();
                } else {
                    const contentType = resp.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        const data = await resp.json();
                        alert('Error: ' + (data.error || 'Failed to stop job'));
                    } else {
                        // Server returned HTML (likely a login redirect due to expired session)
                        alert('Error: Session expired or server error. Please refresh the page and try again.');
                        window.location.reload();
                    }
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function pollLogs(jobId) {
            try {
                // Fetch job status to check if it is finished (completed or failed)
                let isFinished = false;
                try {
                    const statusResp = await fetch(`/job_status/${jobId}`);
                    if (statusResp.ok) {
                        const jobInfo = await statusResp.json();
                        isFinished = ['completed', 'failed'].includes(jobInfo.status);
                    }
                } catch (statusErr) {
                    console.error("Failed to fetch job status during polling", statusErr);
                }

                const resp = await fetch(`/api/jobs/${jobId}/logs?offset=${lastLogOffset}`);
                const data = await resp.json();

                if (data.logs || lastLogOffset > 0) {
                    if (data.logs) {
                        fullLogBuffer += data.logs;
                        lastLogOffset = data.offset;
                    }

                    const sections = parseLogSections(fullLogBuffer);

                    // Auto-select first section on first load
                    if (!currentSelectedStage && sections.length > 0) {
                        // Find the last non-empty running stage, or just pick the last section
                        currentSelectedStage = sections[sections.length - 1].id;
                    }

                    renderLogStageGrid(sections, isFinished);

                    // Check if user is at bottom BEFORE updating content
                    const shouldAutoScroll = isUserAtBottom();

                    // Update displayed content using lazy rendering
                    const content = getStageContent(currentSelectedStage, sections);
                    renderLogContent(content, false);

                    // Only auto-scroll if user was already at the bottom
                    if (shouldAutoScroll) {
                        const modalBody = document.querySelector('#logModal .modal-body');
                        modalBody.scrollTop = modalBody.scrollHeight;
                    }
                } else if (lastLogOffset === 0) {
                    document.getElementById('log-content').textContent = 'Waiting for logs...';
                }
            } catch (err) {
                console.error("Log polling error", err);
            }
        }

        // Initialize
        loadProjects();

        // ===== Smart Auto-Refresh (15s) =====
        // Surgically update active runs, queue, and cluster stats without full reload
        async function silentRefreshRootView() {
            if (currentState.view !== 'root') return;
            try {
                // Refresh cluster stats
                loadClusterStats();

                // Refresh active runs section
                const activeResp = await fetch('/api/runs/active');
                if (activeResp.ok) {
                    const activeRuns = await activeResp.json();
                    const header = container.querySelector('.col-12.full-width.mb-3.mt-2');
                    // Update active run cards in-place by finding existing ones
                    const existingRunCards = container.querySelectorAll('.active-run-card');
                    existingRunCards.forEach(card => {
                        const col = card.closest('.col-12.full-width.mb-3');
                        if (col) col.remove();
                    });
                    // Remove old header if active runs changed
                    const oldHeader = container.querySelector('.col-12.full-width.mb-3.mt-2');
                    if (oldHeader && oldHeader.querySelector('h4 .bi-activity')) {
                        oldHeader.remove();
                    }

                    if (activeRuns.length > 0) {
                        const runningHeader = document.createElement('div');
                        runningHeader.className = 'col-12 full-width mb-3 mt-2';
                        runningHeader.innerHTML = `<h4 class="d-flex align-items-center gap-2" style="color: var(--primary);">
                            <i class="bi bi-activity"></i> Active Cluster Runs
                            <span class="badge-premium badge-primary-premium">${activeRuns.length}</span>
                        </h4>`;
                        container.insertBefore(runningHeader, container.firstChild);

                        activeRuns.forEach(run => {
                            const col = document.createElement('div');
                            col.className = 'col-12 full-width mb-3';
                            const [owner, name] = run.repo.split('/');
                            const viewerUrl = '/view/' + encodeURIComponent(owner) + '/' + encodeURIComponent(name) + '/';
                            const startedAt = run.created_at ? new Date(run.created_at + 'Z') : null;
                            const elapsedStr = startedAt ? formatElapsed(startedAt) : '';
                            const launchDate = startedAt ? startedAt.toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';

                            col.innerHTML = `
                                <div class="active-run-card p-3">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div class="d-flex align-items-center gap-3" onclick="navigateToProject('${run.repo}')" style="cursor: pointer;">
                                            <div class="active-run-status"></div>
                                            <div>
                                                <div class="d-flex align-items-center gap-2 mb-1">
                                                    <h6 class="mb-0" style="color: var(--primary); font-weight: 700;">${escapeHtml(run.repo)}</h6>
                                                    ${elapsedStr ? `<span class="active-run-elapsed" data-started="${run.created_at + 'Z'}">${elapsedStr}</span>` : ''}
                                                </div>
                                                <div class="d-flex align-items-center gap-2 flex-wrap">
                                                    <span class="badge-premium badge-primary-premium"><i class="bi bi-git me-1"></i>${escapeHtml(run.branch)}</span>
                                                    <span class="text-muted" style="font-size:0.8rem;">Job ${run.job_id.substring(0,8)}…</span>
                                                    ${run.username ? `<span class="text-muted" style="font-size:0.8rem;">par <strong>${escapeHtml(run.username)}</strong></span>` : ''}
                                                    ${launchDate ? `<span class="text-muted" style="font-size:0.75rem;"><i class="bi bi-calendar3 me-1"></i>Lancé le ${launchDate}</span>` : ''}
                                                </div>
                                            </div>
                                        </div>
                                        <div class="d-flex gap-2 flex-shrink-0">
                                            <button class="btn btn-outline-danger btn-action" onclick="stopJob('${run.job_id}')">
                                                <i class="bi bi-stop-circle"></i> Stop
                                            </button>
                                            <button class="btn btn-outline-primary btn-action" onclick="showLogs('${run.job_id}')">
                                                <i class="bi bi-terminal"></i> Logs
                                            </button>
                                            <a href="${viewerUrl}" class="btn btn-primary btn-action" target="_blank">
                                                <i class="bi bi-broadcast"></i> ${run.custom_web_app ? 'Web App' : 'DVC-Viewer'}
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            `;
                            // Insert after the header
                            const divider = container.querySelector('.col-12.full-width.mt-4.mb-3');
                            if (divider) {
                                container.insertBefore(col, divider);
                            } else {
                                container.appendChild(col);
                            }
                        });
                    }
                }
            } catch (err) {
                console.warn('Silent refresh failed:', err.message);
            }
        }

        setInterval(silentRefreshRootView, 15000);

        // ===== Global Elapsed Timer (1s) =====
        // Updates all live elapsed counters without triggering fetch
        setInterval(() => {
            // Update active-run-elapsed elements
            document.querySelectorAll('.active-run-elapsed[data-started]').forEach(el => {
                const started = new Date(el.dataset.started);
                el.textContent = formatElapsed(started);
            });
            // Update queue elapsed elements
            document.querySelectorAll('[data-queue-started]').forEach(el => {
                const started = new Date(el.dataset.queueStarted);
                el.textContent = formatElapsed(started);
            });
            // Update "last updated" indicator
            const updateEl = document.getElementById('stats-last-update');
            if (updateEl) {
                const ago = Math.floor((Date.now() - lastStatsUpdate) / 1000);
                if (ago < 5) updateEl.textContent = "à l'instant";
                else updateEl.textContent = `il y a ${ago}s`;
            }
        }, 1000);
    </script>
</body>
</html>
