name: Test Cluster-CI E2E (Mock Cluster)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_runtime_tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -e '.[dev]'
      - name: Test runtime tool isolation and dependency cleanup
        run: |
          bash -n src/runner/bootstrap_runtime_tools.sh src/runner/smart_install.sh src/runner/run_research_pipeline.sh
          python -m pytest -q tests/test_runtime_tools_bootstrap.py tests/test_runtime_image_r1_r5.py tests/test_runtime_env.py
      - name: Smoke test real tools through dependency cleanup and entrypoint recovery
        env:
          CLUSTER_CI_TOOLS_ROOT: ${{ runner.temp }}/runtime-tools-smoke/user-site/share/cluster-ci-tools
          PYTHONUSERBASE: ${{ runner.temp }}/runtime-tools-smoke/user-site
          CLUSTER_CI_HASH_FILE: ${{ runner.temp }}/runtime-tools-smoke/dependency-hash
          CLUSTER_CI_LOCK_FILE: ${{ runner.temp }}/runtime-tools-smoke/dependency-lock
          UV_PYTHON_DOWNLOADS: never
        run: |
          bash src/runner/bootstrap_runtime_tools.sh
          export PATH="$CLUSTER_CI_TOOLS_ROOT/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/runtime-tools-smoke/empty-project"
          cd "$RUNNER_TEMP/runtime-tools-smoke/empty-project"
          bash "$GITHUB_WORKSPACE/src/runner/smart_install.sh"
          uv --version
          dvc --version
          dvc-viewer --help
          # Model the cached environment with a missing launcher from prior failures.
          rm "$CLUSTER_CI_TOOLS_ROOT/bin/dvc-viewer"
          bash "$GITHUB_WORKSPACE/src/runner/bootstrap_runtime_tools.sh"
          dvc-viewer --help

  test_e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -e .[dev]

      - name: Test GPU Watchdog
        # Command fixtures require no GPU or Docker daemon.
        run: |
          python3 -m unittest discover -s src/runner -p test_gpu_watchdog.py -v
          bash -n src/runner/gpu_watchdog.sh

      - name: Setup Mock Runner
        run: |
          sudo mkdir -p /usr/local/bin
          echo -e '#!/bin/bash\necho "Mock runner executing for $1 on branch $2"\nexit 0' | sudo tee /usr/local/bin/cluster-ci-run
          sudo chmod +x /usr/local/bin/cluster-ci-run

      - name: Start Mock Cluster Services
        run: |
          export CLUSTER_DB_PATH=cluster_e2e.db
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src/scheduler
          python3 src/scheduler/headnode_service.py &
          python3 src/scheduler/scheduler_loop.py &
          # Wait for headnode to be up
          sleep 5
          # Start worker agent
          export HEADNODE_URL=http://localhost:5000
          python3 src/scheduler/worker_agent.py &
          sleep 5

      - name: Run E2E Tests
        run: |
          export E2E_TEST=1
          export HEADNODE_URL=http://localhost:5000
          export CLUSTER_CI_RUN_PATH=/usr/local/bin/cluster-ci-run
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src/scheduler
          pytest src/scheduler/tests/
