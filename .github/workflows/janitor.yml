name: DB Janitor (Clean Ghost Jobs)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: janitor-db
  cancel-in-progress: false

jobs:
  janitor:
    name: Run Database Janitor
    runs-on: [self-hosted, cluster-ci-admin]
    timeout-minutes: 2

    steps:
      - name: Trigger Ghost Cleanup
        run: curl -s -X POST http://localhost:5000/clean_ghosts
