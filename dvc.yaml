stages:
  prep:
    cmd: python3 simulate_research.py prep
    deps:
      - simulate_research.py
    outs:
      - artifacts/prep.txt
    metrics:
      - metrics/prep.json:
          cache: false

  branch_a_step1:
    foreach:
      - 1
      - 2
    do:
      cmd: python3 simulate_research.py branch_a_step1 --item ${item}
      deps:
        - simulate_research.py
        - artifacts/prep.txt
      outs:
        - artifacts/branch_a1_${item}.bin
      metrics:
        - metrics/branch_a1_${item}.json:
            cache: false
      meta:
        cluster:
          image: nvcr.io/nvidia/pytorch:26.05-py3
          ram_gb: 4

  branch_a_step2:
    foreach:
      - 1
      - 2
    do:
      cmd: python3 simulate_research.py branch_a_step2 --item ${item}
      deps:
        - simulate_research.py
        - artifacts/branch_a1_${item}.bin
      outs:
        - artifacts/branch_a2_${item}.bin
      metrics:
        - metrics/branch_a2_${item}.json:
            cache: false
      meta:
        cluster:
          image: nvcr.io/nvidia/pytorch:26.05-py3
          ram_gb: 4

  branch_b_step1:
    cmd: python3 simulate_research.py branch_b_step1
    deps:
      - simulate_research.py
      - artifacts/prep.txt
    outs:
      - artifacts/branch_b1.bin
    metrics:
      - metrics/branch_b1.json:
          cache: false
    meta:
      cluster:
        image: nvcr.io/nvidia/pytorch:26.04-py3
        cpus: 2
        ram_gb: 4
        workers:
          - HEC45801

  branch_b_step2:
    cmd: python3 simulate_research.py branch_b_step2
    deps:
      - simulate_research.py
      - artifacts/branch_b1.bin
    outs:
      - artifacts/branch_b2.bin
    metrics:
      - metrics/branch_b2.json:
          cache: false
    meta:
      cluster:
        image: nvcr.io/nvidia/pytorch:26.04-py3
        cpus: 2
        ram_gb: 4
        workers:
          - HEC45803

  pack_light_1:
    cmd: python3 simulate_research.py pack_light_1
    deps:
      - simulate_research.py
      - artifacts/prep.txt
    outs:
      - artifacts/pack_light_1.bin
    metrics:
      - metrics/pack_light_1.json:
          cache: false
    meta:
      cluster:
        cpus: 1
        ram_gb: 1

  pack_light_2:
    cmd: python3 simulate_research.py pack_light_2
    deps:
      - simulate_research.py
      - artifacts/prep.txt
    outs:
      - artifacts/pack_light_2.bin
    metrics:
      - metrics/pack_light_2.json:
          cache: false
    meta:
      cluster:
        cpus: 1
        ram_gb: 1

  join:
    cmd: python3 simulate_research.py join
    deps:
      - simulate_research.py
      - artifacts/branch_a2_1.bin
      - artifacts/branch_a2_2.bin
      - artifacts/branch_b2.bin
      - artifacts/pack_light_1.bin
      - artifacts/pack_light_2.bin
    outs:
      - artifacts/join_summary.txt
    metrics:
      - metrics/join.json:
          cache: false
    meta:
      cluster:
        gpus: 1
        vram_gb: 1
